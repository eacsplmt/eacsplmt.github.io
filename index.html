<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eacsplmt</title>
    <style>
        :root {
            --bg: #0d1117;
            --card: rgba(22, 27, 34, 0.85);
            --border: #30363d;
            --text: #c9d1d9;
            --muted: #8b949e;
            --accent: #58a6ff;
            --green: #3fb950;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            position: relative;
        }

        .bg-image {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 1200px;
            height: 100%;
            object-fit: cover;
            object-position: top center;
            opacity: 0.15;
            z-index: 0;
            pointer-events: none;
        }

        .container {
            max-width: 800px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 32px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #58a6ff, #3fb950);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: bold;
            color: #fff;
            flex-shrink: 0;
        }

        .header-info h1 {
            font-size: 28px;
            margin-bottom: 4px;
        }

        .header-info p {
            color: var(--muted);
            font-size: 16px;
        }

        .section {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .section h2 {
            font-size: 18px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section h2::before {
            content: '';
            width: 4px;
            height: 18px;
            background: var(--green);
            border-radius: 2px;
        }

        .doc-list {
            list-style: none;
        }

        .doc-list li {
            padding: 0;
            border-bottom: 1px solid var(--border);
        }

        .doc-list li:last-child {
            border-bottom: none;
        }

        .doc-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 12px;
            color: var(--text);
            text-decoration: none;
            border-radius: 6px;
            transition: all 0.2s;
            cursor: pointer;
        }

        .doc-link:hover {
            background: rgba(88, 166, 255, 0.08);
            color: var(--accent);
        }

        .doc-icon {
            font-size: 20px;
            flex-shrink: 0;
        }

        .doc-name {
            flex: 1;
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .doc-arrow {
            color: var(--muted);
            font-size: 16px;
            transition: transform 0.2s;
        }

        .doc-link:hover .doc-arrow {
            transform: translateX(4px);
            color: var(--accent);
        }

        .empty-msg {
            color: var(--muted);
            text-align: center;
            padding: 20px;
            font-size: 14px;
        }

        .footer {
            text-align: center;
            color: var(--muted);
            font-size: 13px;
            margin-top: 32px;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 20px;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: #161b22;
            border: 1px solid var(--border);
            border-radius: 12px;
            max-width: 700px;
            width: 100%;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
        }

        .modal-header h3 {
            font-size: 16px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 80%;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--muted);
            font-size: 24px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
            transition: all 0.2s;
            line-height: 1;
        }

        .modal-close:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
        }

        .modal-content {
            padding: 20px;
            overflow-y: auto;
            font-size: 15px;
            line-height: 1.7;
            white-space: pre-wrap;
            word-break: break-word;
            color: var(--text);
        }

        @media (max-width: 600px) {
            .header {
                flex-direction: column;
                text-align: center;
            }
            .section {
                padding: 16px;
            }
        }
    </style>
</head>
<body>
    <img src="bg.png" alt="" class="bg-image" onerror="this.style.display='none'">

    <div class="container">
        <div class="header">
            <div class="avatar">E</div>
            <div class="header-info">
                <h1>eacsplmt</h1>
                <p>👋 Hi there! 欢迎来到我的 GitHub 主页</p>
            </div>
        </div>

        <div class="section">
            <h2>📄 文档目录</h2>
            <ul class="doc-list" id="docList">
                <li class="empty-msg">加载中...</li>
            </ul>
        </div>

        <div class="footer">
            © 2026 eacsplmt · Powered by GitHub Pages
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle"></h3>
                <button class="modal-close" id="modalClose">&times;</button>
            </div>
            <div class="modal-content" id="modalContent"></div>
        </div>
    </div>

    <script>
        const REPO_OWNER = 'eacsplmt';
        const REPO_NAME = 'eacsplmt.github.io';
        const TXT_DIR = 'txt';

        const docList = document.getElementById('docList');
        const modalOverlay = document.getElementById('modalOverlay');
        const modalTitle = document.getElementById('modalTitle');
        const modalContent = document.getElementById('modalContent');
        const modalClose = document.getElementById('modalClose');

        // 带时间戳的 API 请求，绕过浏览器缓存
        async function loadDocList() {
            try {
                const api = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${TXT_DIR}?t=${Date.now()}`;
                const res = await fetch(api);
                if (!res.ok) throw new Error('API error');
                const files = await res.json();

                if (!Array.isArray(files)) throw new Error('Invalid response');

                const txtFiles = files
                    .filter(f => f.type === 'file' && f.name.toLowerCase().endsWith('.txt'))
                    .map(f => f.name)
                    .sort((a, b) => a.localeCompare(b, 'zh'));

                renderDocList(txtFiles);
            } catch (err) {
                docList.innerHTML = '<li class="empty-msg">❌ 无法读取 txt/ 文件夹，请确认文件夹存在</li>';
            }
        }

        function renderDocList(files) {
            if (files.length === 0) {
                docList.innerHTML = '<li class="empty-msg">暂无文档</li>';
                return;
            }

            docList.innerHTML = files.map(file => {
                const displayName = file.replace(/\.txt$/i, '');
                return `
                    <li>
                        <a href="#" class="doc-link" data-file="${file}">
                            <span class="doc-icon">📄</span>
                            <span class="doc-name">${displayName}</span>
                            <span class="doc-arrow">→</span>
                        </a>
                    </li>
                `;
            }).join('');

            document.querySelectorAll('.doc-link').forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    openDoc(link.dataset.file);
                });
            });
        }

        // 读文件内容也加时间戳
        async function openDoc(filename) {
            const fullPath = `${TXT_DIR}/${encodeURIComponent(filename)}?t=${Date.now()}`;
            try {
                const response = await fetch(fullPath);
                if (!response.ok) throw new Error('404');
                const text = await response.text();
                modalTitle.textContent = filename;
                modalContent.textContent = text;
                modalOverlay.classList.add('active');
            } catch (err) {
                modalTitle.textContent = filename;
                modalContent.textContent = '❌ 无法读取该文件';
                modalOverlay.classList.add('active');
            }
        }

        modalClose.addEventListener('click', () => {
            modalOverlay.classList.remove('active');
        });

        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) {
                modalOverlay.classList.remove('active');
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                modalOverlay.classList.remove('active');
            }
        });

        loadDocList();
    </script>
</body>
</html>
